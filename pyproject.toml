[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="pyfileguard"
version="0.3.0"
description="SHA-256 file integrity monitoring by FortiX CyberTech"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Sami Ur Rahman"}]
[project.scripts]
pyfileguard="pyfileguard.cli:main"
[tool.pytest.ini_options]
testpaths=["tests"]
